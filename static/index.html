<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>baton</title>
<style>
  :root { --bg:#0d1117; --fg:#e6edf3; --dim:#8b949e; --card:#161b22; --acc:#f97316; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; margin:0 }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 ui-monospace,Menlo,monospace; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid #30363d; }
  header b { color:var(--acc) }
  #dot { width:9px; height:9px; border-radius:50%; background:var(--bad) }
  #dot.on { background:var(--ok) }
  .spacer { flex:1 }
  button { background:var(--card); color:var(--fg); border:1px solid #30363d; border-radius:6px; padding:8px 12px; font:inherit; }
  button:active { border-color:var(--acc) }
  #sessions { max-height:30vh; overflow:auto; border-bottom:1px solid #30363d; display:none; }
  #sessions.open { display:block }
  .sess { padding:10px 14px; border-bottom:1px solid #21262d; color:var(--dim); cursor:pointer; }
  .sess:hover { color:var(--fg) }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:92%; padding:10px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
  .user { align-self:flex-end; background:#1f3a5f; }
  .agent { align-self:flex-start; background:var(--card); }
  .tool { align-self:stretch; background:var(--card); border-left:3px solid var(--dim); padding:8px 12px; font-size:12px; color:var(--dim); }
  .tool .st { float:right }
  .tool.ok { border-left-color:var(--ok) } .tool.err { border-left-color:var(--bad) }
  #perm { display:none; margin:0 14px 10px; padding:12px; background:#2d2106; border:1px solid var(--acc); border-radius:10px; }
  #perm h3 { font-size:13px; color:var(--acc); margin-bottom:6px }
  #perm pre { font-size:11px; color:var(--dim); max-height:80px; overflow:auto; margin-bottom:10px; white-space:pre-wrap }
  #perm .opts { display:flex; gap:8px; flex-wrap:wrap }
  #perm .opts button { flex:1; min-width:120px; padding:12px; }
  #perm .opts .allow { border-color:var(--ok) }
  #perm .opts .deny { border-color:var(--bad) }
  #composer { display:flex; gap:8px; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #30363d; }
  #in { flex:1; background:var(--card); color:var(--fg); border:1px solid #30363d; border-radius:8px; padding:10px; font:inherit; }
  #mic.rec { border-color:var(--bad); color:var(--bad); animation:pulse 1s infinite }
  @keyframes pulse { 50% { opacity:.5 } }
  #toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#21262d; padding:8px 14px; border-radius:8px; display:none; font-size:12px }
</style>
</head>
<body>
<header>
  <div id="dot"></div><b>baton</b>
  <span id="status" style="color:var(--dim);font-size:11px"></span>
  <div class="spacer"></div>
  <select id="modeSel" style="background:var(--card);color:var(--fg);border:1px solid #30363d;border-radius:6px;padding:6px;font:inherit;font-size:11px"></select>
  <button id="sessBtn">Sessions</button>
  <button id="newBtn">+ New</button>
</header>
<div id="sessions"></div>
<div id="log"></div>
<div id="perm">
  <h3>Permission requested</h3>
  <pre id="permBody"></pre>
  <div class="opts" id="permOpts"></div>
  <div style="margin-top:8px"><button id="permMic">&#127908; answer by voice</button></div>
</div>
<div id="composer">
  <input id="in" placeholder="prompt or dictate…" autocomplete="off">
  <button id="mic">&#127908;</button>
  <button id="send">Send</button>
  <button id="stop" style="display:none">Stop</button>
</div>
<div id="toast"></div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const $ = id => document.getElementById(id);
let ws, sessionId = null, cwd = null, curAgentEl = null, nextId = 0;
const rpcPending = {};
let permRequest = null; // {requestId, options}
let mediaRec = null, chunks = [];

function toast(t, ms=2500){ const e=$('toast'); e.textContent=t; e.style.display='block'; setTimeout(()=>e.style.display='none',ms); }

function connect(){
  ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?token=${token}`);
  ws.onopen = () => { $('dot').className='on'; };
  ws.onclose = () => { $('dot').className=''; $('status').textContent='disconnected'; setTimeout(connect, 2000); };
  ws.onmessage = ev => onMsg(JSON.parse(ev.data));
}

function rpc(method, params){
  return new Promise((res, rej) => {
    const id = ++nextId;
    rpcPending[id] = {res, rej};
    ws.send(JSON.stringify({type:'rpc', id, method, params}));
  });
}
function notify(method, params){ ws.send(JSON.stringify({type:'notify', method, params})); }

function el(cls, text){ const d=document.createElement('div'); d.className=cls; if(text!=null)d.textContent=text; $('log').appendChild(d); d.scrollIntoView({block:'end'}); return d; }

function onMsg(m){
  if (m.id != null && rpcPending[m.id]) {
    const p = rpcPending[m.id]; delete rpcPending[m.id];
    m.error ? p.rej(new Error(m.error.message)) : p.res(m.result);
    return;
  }
  if (m.type === 'agent_request') return onAgentRequest(m);
  if (m.type === 'error') return toast(m.message);
  if (m.method === 'bridge/status') {
    $('status').textContent = m.params.state;
    if (m.params.cwd && !cwd) cwd = m.params.cwd;
    return;
  }
  if (m.method === 'session/update') return onUpdate(m.params);
}

function onUpdate(p){
  const u = p.update || {};
  const t = u.sessionUpdate;
  if (t === 'agent_message_chunk' || t === 'user_message_chunk'){
    const txt = (u.content && u.content.text) || '';
    if (!txt) return;
    if (t === 'user_message_chunk') { el('msg user', txt); curAgentEl=null; return; }
    if (!curAgentEl) curAgentEl = el('msg agent','');
    curAgentEl.textContent += txt;
    curAgentEl.scrollIntoView({block:'end'});
  } else if (t === 'tool_call'){
    curAgentEl=null;
    const d = el('tool','');
    d.dataset.tc = u.toolCallId;
    d.innerHTML = `<span class="st">${u.status||''}</span>⚙ ${u.title||u.kind||'tool'}`;
    toolEls[u.toolCallId] = d;
  } else if (t === 'tool_call_update'){
    const d = toolEls[u.toolCallId];
    if (d){ if (u.title) d.childNodes[1].textContent = '⚙ '+u.title;
      d.querySelector('.st').textContent = u.status||'';
      d.className = 'tool ' + (u.status==='completed'?'ok':u.status==='failed'?'err':''); }
  } else if (t === 'current_mode_update'){
    if ($('modeSel').value !== u.currentModeId) $('modeSel').value = u.currentModeId;
  } else if (t === 'plan' || t === 'agent_thought_chunk'){
    // keep the demo clean
  }
}
const toolEls = {};

function onAgentRequest(m){
  if (m.method === 'session/request_permission') return showPerm(m);
  // auto-decline requests we can't serve (fs, terminal, …)
  ws.send(JSON.stringify({type:'agent_response', requestId:m.requestId,
    error:{code:-32601, message:'unsupported by baton'}}));
}

function showPerm(m){
  permRequest = m;
  const tc = m.params.toolCall || {};
  $('permBody').textContent = `${tc.title||'tool call'}\n${tc.rawInput?JSON.stringify(tc.rawInput).slice(0,400):''}`;
  const box = $('permOpts'); box.innerHTML='';
  (m.params.options||[]).forEach(o=>{
    const b=document.createElement('button');
    b.textContent = o.name || o.optionId;
    b.className = o.kind && o.kind.startsWith('reject') ? 'deny' : 'allow';
    b.onclick = ()=>answerPerm(o.optionId);
    box.appendChild(b);
  });
  const c=document.createElement('button');
  c.textContent='Cancel'; c.className='deny';
  c.onclick=()=>answerPerm(null); box.appendChild(c);
  $('perm').style.display='block';
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
}

function answerPerm(optionId){
  if (!permRequest) return;
  const result = optionId
    ? {outcome:{outcome:'selected', optionId}}
    : {outcome:{outcome:'cancelled'}};
  ws.send(JSON.stringify({type:'agent_response', requestId:permRequest.requestId, result}));
  $('perm').style.display='none';
  permRequest = null;
}

function setModes(modes){
  const sel = $('modeSel'); sel.innerHTML='';
  (modes && modes.availableModes || []).forEach(m=>{
    const o=document.createElement('option');
    o.value=m.id; o.textContent=m.name||m.id;
    if (modes.currentModeId===m.id) o.selected=true;
    sel.appendChild(o);
  });
}

async function newSession(){
  try {
    const r = await rpc('session/new', {cwd, mcpServers:[]});
    sessionId = r.sessionId;
    setModes(r.modes);
    toast('session ' + sessionId.slice(0,8));
    $('log').innerHTML=''; curAgentEl=null;
  } catch(e){ toast('new: '+e.message); }
}

async function listSessions(){
  const box=$('sessions');
  if (box.className==='open'){ box.className=''; return; }
  box.className='open'; box.innerHTML='<div class="sess">loading…</div>';
  try {
    const r = await rpc('session/list', {cwd});
    box.innerHTML='';
    (r.sessions||[]).forEach(s=>{
      const d=document.createElement('div'); d.className='sess';
      d.textContent = (s.title||'(untitled)') + ' · ' + (s.updatedAt||'').slice(0,16).replace('T',' ');
      d.onclick = ()=>loadSession(s.sessionId);
      box.appendChild(d);
    });
    if (!(r.sessions||[]).length) box.innerHTML='<div class="sess">no sessions</div>';
  } catch(e){ box.innerHTML=`<div class="sess">list failed: ${e.message}</div>`; }
}

async function loadSession(id){
  $('sessions').className='';
  try {
    await rpc('session/load', {sessionId:id, cwd, mcpServers:[]});
    sessionId = id;
    toast('resumed ' + id.slice(0,8));
  } catch(e){ toast('load: '+e.message); }
}

async function send(){
  const v = $('in').value.trim(); if (!v) return;
  $('in').value='';
  if (!sessionId) await newSession();
  if (!sessionId) return;
  el('msg user', v);
  try {
    $('stop').style.display='';
    await rpc('session/prompt', {sessionId, prompt:[{type:'text', text:v}]});
  } catch(e){ toast('prompt: '+e.message); }
  finally { $('stop').style.display='none'; curAgentEl=null; }
}

async function micToggle(forPerm){
  const btn = forPerm ? $('permMic') : $('mic');
  if (mediaRec) { mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e=>chunks.push(e.data);
    mediaRec.onstop = async ()=>{
      mediaRec=null; btn.classList.remove('rec');
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      btn.disabled = true;
      try {
        const r = await fetch('/api/voice?token='+token, {method:'POST', body:blob,
          headers:{'Content-Type':'audio/webm'}});
        const j = await r.json();
        if (j.error) return toast(j.error);
        const text = (j.text||'').trim();
        toast('🎤 ' + text);
        if (permRequest) voiceAnswer(text); else $('in').value = text;
      } finally { btn.disabled=false; }
    };
    mediaRec.start(); btn.classList.add('rec');
    toast('listening… tap again to stop');
  } catch(e){ toast('mic: '+e.message); }
}

function voiceAnswer(text){
  const t = text.toLowerCase();
  const opts = permRequest.params.options||[];
  const yes = /(yes|yeah|approve|allow|ok|go ahead|sure|confirm)/.test(t);
  const no  = /(no|nope|reject|deny|cancel|stop|don't)/.test(t);
  if (yes && !no){
    const allow = opts.find(o=>o.kind==='allow_always') || opts.find(o=>o.kind && o.kind.startsWith('allow')) || opts[0];
    if (allow) return answerPerm(allow.optionId);
  }
  if (no) return answerPerm(null);
  toast('unclear — tap a button');
}

$('send').onclick = send;
$('in').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
$('newBtn').onclick = newSession;
$('sessBtn').onclick = listSessions;
$('mic').onclick = ()=>micToggle(false);
$('permMic').onclick = ()=>micToggle(true);
$('stop').onclick = ()=>{ if(sessionId) notify('session/cancel', {sessionId}); };
$('modeSel').onchange = e=>{
  if (sessionId) notify('session/set_mode', {sessionId, modeId:e.target.value});
};

connect();
</script>
</body>
</html>
