<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0f">
<title>baton — Vibe in your hands</title>
<style>
  :root {
    --bg: #0b0b0f;
    --surface: #14141a;
    --surface2: #1c1c24;
    --line: #2a2a33;
    --fg: #f4f1ea;
    --dim: #9a978f;
    --acc: #ff8200;
    --ok: #2fbf71;
    --bad: #ff4d4d;
    --stripe: linear-gradient(90deg,#ffd500 0%,#ff8a00 28%,#ff3d00 52%,#d0006f 76%,#0057ff 100%);
    --r: 12px;
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent }
  html,body { height:100% }
  body { background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; display:flex; flex-direction:column; height:100dvh; }
  code,pre,.mono { font-family:ui-monospace,"SF Mono",Menlo,monospace }

  .stripe { height:4px; background:var(--stripe); flex:none }

  header { display:flex; align-items:center; gap:10px; padding:12px 16px; }
  .wordmark { font-weight:800; font-size:18px; letter-spacing:-.5px }
  .wordmark em { font-style:normal; color:var(--acc) }
  .tag { font-size:10px; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin-top:-2px }
  #pill { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--dim); background:var(--surface); border:1px solid var(--line); border-radius:99px; padding:4px 10px }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--bad); transition:background .3s }
  #dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok) }
  .spacer { flex:1 }
  button,.btn { background:var(--surface2); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font:inherit; font-size:13px; cursor:pointer; transition:transform .08s,border-color .2s,filter .2s }
  button:active { transform:scale(.97); filter:brightness(1.3) }
  select { background:var(--surface2); color:var(--fg); border:1px solid var(--line); border-radius:10px; padding:7px 8px; font:inherit; font-size:11px; max-width:110px }
  .iconbtn { padding:9px 11px }

  #sessions { max-height:0; overflow:hidden; border-bottom:1px solid var(--line); transition:max-height .25s ease }
  #sessions.open { max-height:32vh; overflow-y:auto }
  .sess { padding:13px 16px; border-bottom:1px solid var(--line); color:var(--dim); cursor:pointer; font-size:13px }
  .sess:active { color:var(--fg); background:var(--surface) }

  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; -webkit-overflow-scrolling:touch }
  .msg { max-width:90%; padding:12px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word; animation:pop .18s ease }
  .user { align-self:flex-end; background:linear-gradient(135deg,#3a2a16,#4a3018); border:1px solid #6b4a22 }
  .agent { align-self:flex-start; background:var(--surface); border:1px solid var(--line) }
  .tool { align-self:stretch; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--dim); padding:9px 12px; font-size:12px; color:var(--dim); border-radius:8px }
  .tool .st { margin-left:auto; font-size:10px; text-transform:uppercase; letter-spacing:.06em; background:var(--surface2); padding:3px 8px; border-radius:99px }
  .tool.ok { border-left-color:var(--ok) } .tool.ok .st { color:var(--ok) }
  .tool.err { border-left-color:var(--bad) } .tool.err .st { color:var(--bad) }
  @keyframes pop { from { opacity:0; transform:translateY(6px) } }

  /* ── the hero: permission card ─────────────────────────── */
  #perm { display:none; margin:0 16px 12px; background:#1f150a; border:1px solid #5a3a12; border-radius:16px; overflow:hidden; box-shadow:0 8px 40px rgba(255,130,0,.15); animation:rise .25s ease, pulse 1.6s 2 }
  #perm::before { content:''; display:block; height:4px; background:var(--stripe) }
  #perm .inner { padding:14px 16px 16px }
  #perm h3 { font-size:15px; color:var(--acc); letter-spacing:.02em; margin-bottom:8px; display:flex; align-items:center; gap:8px }
  #perm h3::before { content:'⚠' }
  #permBody { font-size:12px; color:var(--dim); background:rgba(0,0,0,.3); border:1px solid var(--line); border-radius:8px; padding:10px; max-height:90px; overflow:auto; margin-bottom:12px; white-space:pre-wrap; font-family:ui-monospace,Menlo,monospace }
  #perm .opts { display:flex; gap:10px; flex-wrap:wrap }
  #perm .opts button { flex:1; min-width:120px; padding:16px; font-size:15px; font-weight:700; border-radius:12px }
  #perm .opts .allow { background:#0d2818; border-color:var(--ok); color:var(--ok) }
  #perm .opts .deny { background:#2a1215; border-color:var(--bad); color:var(--bad) }
  #perm .voicerow { margin-top:10px }
  #permMic { width:100%; padding:14px; font-size:14px; border-style:dashed; border-color:#6b4a22 }
  @keyframes rise { from { opacity:0; transform:translateY(16px) } }
  @keyframes pulse { 50% { box-shadow:0 8px 60px rgba(255,130,0,.4) } }

  #composer { display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--bg) }
  #in { flex:1; background:var(--surface); color:var(--fg); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; outline:none }
  #in:focus { border-color:var(--acc) }
  #send { background:var(--acc); border-color:var(--acc); color:#111; font-weight:700 }
  #mic.rec, #permMic.rec { border-color:var(--bad); color:var(--bad); animation:blink 1s infinite }
  @keyframes blink { 50% { opacity:.5 } }

  #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(28,28,36,.92); backdrop-filter:blur(8px); border:1px solid var(--line); padding:9px 16px; border-radius:99px; display:none; font-size:12px; z-index:10 }
  #qr { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:20; flex-direction:column; gap:14px }
  #qr.open { display:flex }
  #qr img { width:min(72vw,320px); border-radius:16px; border:4px solid var(--surface2) }
  #qr p { color:var(--dim); font-size:12px; text-align:center; padding:0 24px }
</style>
</head>
<body>
<div class="stripe"></div>
<header>
  <div>
    <div class="wordmark">bat<em>on</em></div>
    <div class="tag">vibe in your hands</div>
  </div>
  <div id="pill"><div id="dot"></div><span id="status">…</span></div>
  <div class="spacer"></div>
  <button id="narrBtn" class="iconbtn" title="agent narrates out loud">🔊</button>
  <button id="pairBtn" class="iconbtn" title="pair another device">▦</button>
  <select id="modeSel"></select>
  <button id="sessBtn">Sessions</button>
  <button id="newBtn">+ New</button>
</header>
<div id="sessions"></div>
<div id="log"></div>
<div id="perm">
  <div class="inner">
    <h3>Approval requested</h3>
    <pre id="permBody"></pre>
    <div class="opts" id="permOpts"></div>
    <div class="voicerow"><button id="permMic">🎙 speak your answer</button></div>
  </div>
</div>
<div id="composer">
  <input id="in" placeholder="prompt, or dictate…" autocomplete="off">
  <button id="mic" class="iconbtn">🎙</button>
  <button id="stop" class="iconbtn" style="display:none">■</button>
  <button id="send">Send</button>
</div>
<div id="toast"></div>
<div id="qr"><img id="qrimg" alt="pair QR"><p id="qrurl"></p><button onclick="document.getElementById('qr').className=''">close</button></div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const $ = id => document.getElementById(id);
let ws, sessionId = null, cwd = null, curAgentEl = null, nextId = 0;
let lastAgentText = '', narrationOn = false;
const rpcPending = {}, toolEls = {};
let permRequest = null, mediaRec = null, chunks = [];

function toast(t, ms=2800){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',ms); }

function connect(){
  ws = new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws?token=${token}`);
  ws.onopen = () => { $('dot').className='on'; };
  ws.onclose = () => { $('dot').className=''; $('status').textContent='reconnecting…'; setTimeout(connect, 2000); };
  ws.onmessage = ev => onMsg(JSON.parse(ev.data));
}

function rpc(method, params){
  return new Promise((res, rej) => {
    const id = ++nextId;
    rpcPending[id] = {res, rej};
    ws.send(JSON.stringify({type:'rpc', id, method, params}));
  });
}
function notify(method, params){ ws.send(JSON.stringify({type:'notify', method, params})); }

function el(cls, text){ const d=document.createElement('div'); d.className=cls; if(text!=null)d.textContent=text; $('log').appendChild(d); d.scrollIntoView({block:'end'}); return d; }

function onMsg(m){
  if (m.id != null && rpcPending[m.id]) {
    const p = rpcPending[m.id]; delete rpcPending[m.id];
    m.error ? p.rej(new Error(m.error.message)) : p.res(m.result);
    return;
  }
  if (m.type === 'agent_request') return onAgentRequest(m);
  if (m.type === 'agent_resolved') {
    if (permRequest && permRequest.requestId === m.requestId) {
      $('perm').style.display='none'; permRequest=null; toast('answered on another device');
    }
    return;
  }
  if (m.type === 'error') return toast(m.message);
  if (m.method === 'bridge/status') {
    $('status').textContent = m.params.state;
    if (m.params.cwd && !cwd) cwd = m.params.cwd;
    return;
  }
  if (m.method === 'session/update') return onUpdate(m.params);
}

function onUpdate(p){
  const u = p.update || {};
  const t = u.sessionUpdate;
  if (t === 'agent_message_chunk' || t === 'user_message_chunk'){
    const txt = (u.content && u.content.text) || '';
    if (!txt) return;
    if (t === 'user_message_chunk') { curAgentEl=null; return; }
    if (!curAgentEl) { curAgentEl = el('msg agent',''); lastAgentText=''; }
    curAgentEl.textContent += txt; lastAgentText += txt;
    curAgentEl.scrollIntoView({block:'end'});
  } else if (t === 'tool_call'){
    curAgentEl=null;
    const d = el('tool','');
    d.innerHTML = `<span>⚙ ${u.title||u.kind||'tool'}</span><span class="st">${u.status||''}</span>`;
    toolEls[u.toolCallId] = d;
  } else if (t === 'tool_call_update'){
    const d = toolEls[u.toolCallId];
    if (d){ if (u.title) d.firstElementChild.textContent = '⚙ '+u.title;
      d.querySelector('.st').textContent = u.status||'';
      d.className = 'tool ' + (u.status==='completed'?'ok':u.status==='failed'?'err':''); }
  } else if (t === 'current_mode_update'){
    if ($('modeSel').value !== u.currentModeId) $('modeSel').value = u.currentModeId;
  }
}

function onAgentRequest(m){
  if (m.method === 'session/request_permission') return showPerm(m);
  ws.send(JSON.stringify({type:'agent_response', requestId:m.requestId,
    error:{code:-32601, message:'unsupported by baton'}}));
}

function showPerm(m){
  permRequest = m;
  const tc = m.params.toolCall || {};
  $('permBody').textContent = `${tc.title||'tool call'}\n${tc.rawInput?JSON.stringify(tc.rawInput).slice(0,500):''}`;
  const box = $('permOpts'); box.innerHTML='';
  (m.params.options||[]).forEach(o=>{
    const b=document.createElement('button');
    b.textContent = o.name || o.optionId;
    b.className = o.kind && o.kind.startsWith('reject') ? 'deny' : 'allow';
    b.onclick = ()=>answerPerm(o.optionId);
    box.appendChild(b);
  });
  const c=document.createElement('button');
  c.textContent='✕ cancel'; c.className='deny';
  c.onclick=()=>answerPerm(null); box.appendChild(c);
  $('perm').style.display='block';
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
  if (narrationOn) narrate(`Approval requested. ${tc.title||'Tool call'}`);
}

function answerPerm(optionId){
  if (!permRequest) return;
  const result = optionId
    ? {outcome:{outcome:'selected', optionId}}
    : {outcome:{outcome:'cancelled'}};
  ws.send(JSON.stringify({type:'agent_response', requestId:permRequest.requestId, result}));
  $('perm').style.display='none';
  permRequest = null;
}

async function narrate(text){
  try { await rpc('_voice/narrate', {assistantText: text.slice(0, 2000)}); }
  catch(e){ toast('narrate: '+e.message); }
}

function setModes(modes){
  const sel = $('modeSel'); sel.innerHTML='';
  (modes && modes.availableModes || []).forEach(m=>{
    const o=document.createElement('option');
    o.value=m.id; o.textContent=m.name||m.id;
    if (modes.currentModeId===m.id) o.selected=true;
    sel.appendChild(o);
  });
}

async function newSession(){
  try {
    const r = await rpc('session/new', {cwd, mcpServers:[]});
    sessionId = r.sessionId;
    setModes(r.modes);
    toast('session ' + sessionId.slice(0,8));
    $('log').innerHTML=''; curAgentEl=null;
  } catch(e){ toast('new session: '+e.message); }
}

async function listSessions(){
  const box=$('sessions');
  if (box.className==='open'){ box.className=''; return; }
  box.className='open'; box.innerHTML='<div class="sess">loading…</div>';
  try {
    const r = await rpc('session/list', {cwd});
    box.innerHTML='';
    (r.sessions||[]).forEach(s=>{
      const d=document.createElement('div'); d.className='sess';
      d.textContent = (s.title||'(untitled)') + ' · ' + (s.updatedAt||'').slice(0,16).replace('T',' ');
      d.onclick = ()=>loadSession(s.sessionId);
      box.appendChild(d);
    });
    if (!(r.sessions||[]).length) box.innerHTML='<div class="sess">no sessions yet</div>';
  } catch(e){ box.innerHTML=`<div class="sess">list failed: ${e.message}</div>`; }
}

async function loadSession(id){
  $('sessions').className='';
  try {
    await rpc('session/load', {sessionId:id, cwd, mcpServers:[]});
    sessionId = id;
    toast('resumed ' + id.slice(0,8));
  } catch(e){ toast('load: '+e.message); }
}

async function send(){
  const v = $('in').value.trim(); if (!v) return;
  $('in').value='';
  if (!sessionId) await newSession();
  if (!sessionId) return;
  el('msg user', v);
  try {
    $('stop').style.display='';
    await rpc('session/prompt', {sessionId, prompt:[{type:'text', text:v}]});
    if (narrationOn && lastAgentText) narrate(lastAgentText);
  } catch(e){ toast('prompt: '+e.message); }
  finally { $('stop').style.display='none'; curAgentEl=null; }
}

async function micToggle(forPerm){
  const btn = forPerm ? $('permMic') : $('mic');
  if (mediaRec) { mediaRec.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    chunks = [];
    mediaRec = new MediaRecorder(stream);
    mediaRec.ondataavailable = e=>chunks.push(e.data);
    mediaRec.onstop = async ()=>{
      mediaRec=null; btn.classList.remove('rec');
      stream.getTracks().forEach(t=>t.stop());
      const blob = new Blob(chunks, {type:'audio/webm'});
      btn.disabled = true;
      try {
        const r = await fetch('/api/voice?token='+token, {method:'POST', body:blob,
          headers:{'Content-Type':'audio/webm'}});
        const j = await r.json();
        if (j.error) return toast(j.error);
        const text = (j.text||'').trim();
        toast('🎙 ' + text, 4000);
        if (permRequest) voiceAnswer(text); else $('in').value = text;
      } finally { btn.disabled=false; }
    };
    mediaRec.start(); btn.classList.add('rec');
    toast('listening… tap again to stop');
  } catch(e){ toast('mic unavailable — needs HTTPS (use ./tunnel.sh)'); }
}

function voiceAnswer(text){
  const t = text.toLowerCase();
  const opts = permRequest.params.options||[];
  const yes = /(yes|yeah|approve|allow|ok|go ahead|sure|confirm)/.test(t);
  const no  = /(no|nope|reject|deny|cancel|stop|don't)/.test(t);
  if (yes && !no){
    const allow = opts.find(o=>o.kind==='allow_always') || opts.find(o=>o.kind && o.kind.startsWith('allow')) || opts[0];
    if (allow) return answerPerm(allow.optionId);
  }
  if (no) return answerPerm(null);
  toast('unclear — tap a button');
}

$('send').onclick = send;
$('in').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
$('newBtn').onclick = newSession;
$('sessBtn').onclick = listSessions;
$('mic').onclick = ()=>micToggle(false);
$('permMic').onclick = ()=>micToggle(true);
$('stop').onclick = ()=>{ if(sessionId) notify('session/cancel', {sessionId}); };
$('modeSel').onchange = e=>{
  if (sessionId) notify('session/set_mode', {sessionId, modeId:e.target.value});
};
$('narrBtn').onclick = ()=>{
  narrationOn = !narrationOn;
  $('narrBtn').style.borderColor = narrationOn ? 'var(--acc)' : '';
  $('narrBtn').style.color = narrationOn ? 'var(--acc)' : '';
  toast(narrationOn ? 'agent narration ON — speaks on the host machine' : 'narration off');
};
$('pairBtn').onclick = ()=>{
  $('qrimg').src = '/qr.png?token=' + token;
  $('qrurl').textContent = 'scan to watch this session on another device';
  $('qr').className = 'open';
};

connect();
</script>
</body>
</html>
